---

- name: Validate CrowdSec parser lists
  ansible.builtin.assert:
    that:
      - item | type_debug == 'list'
    fail_msg: crowdsec_parsers and each parser contribution must be lists.
  loop: "{{ _crowdsec_parser_lists }}"

- name: Validate CrowdSec parser names
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
    fail_msg: CrowdSec parser names must be non-empty strings.
  loop: "{{ _crowdsec_effective_parsers }}"

- name: Download the CrowdSec install script
  ansible.builtin.get_url:
    url: https://install.crowdsec.net
    dest: /var/tmp/crowdsec-install.sh
    mode: '0755'
  delegate_to: localhost
  run_once: true
  become: false

- name: Copy the CrowdSec install script
  ansible.builtin.copy:
    src: /var/tmp/crowdsec-install.sh
    dest: /var/tmp/crowdsec-install.sh
    mode: '0755'

- name: Run the CrowdSec install script
  ansible.builtin.command: /bin/sh /var/tmp/crowdsec-install.sh
  become: true

- name: Install crowdsec
  ansible.builtin.apt:
    name:
      - crowdsec
      - crowdsec-firewall-bouncer-iptables
    state: present
    cache_valid_time: 3600

- name: Start/enable crowdsec
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: True
  loop:
    - crowdsec
    - crowdsec-firewall-bouncer

- name: Install CrowdSec parsers
  ansible.builtin.command:
    argv:
      - cscli
      - parsers
      - install
      - "{{ item }}"
  register: crowdsec_parser_install
  changed_when: "'Nothing to install' not in (crowdsec_parser_install.stdout ~ crowdsec_parser_install.stderr)"
  loop: "{{ _crowdsec_effective_parsers | unique | sort }}"
